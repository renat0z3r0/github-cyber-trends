title: GitHub Cyber Trends
description: >-
  Digest quotidiano di repository open source di cybersecurity, nuovi e attivamente mantenuti. /
  Daily curated digest of new, actively maintained open-source cybersecurity repositories.
theme: minima
lang: it
plugins: []
# An empty list is not enough on its own: minima treats it as "all pages".
# _includes/header.html therefore omits the nav.
header_pages: []
exclude:
  - README.md
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "digests"
    values:
      # page layout would print page.title as a second H1 beside the markdown date
      layout: default
